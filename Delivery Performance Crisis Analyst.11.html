<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delivery Performance Crisis Analyst</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:wght@600&display=swap">
<style>
:root{--bg:#eef2ef;--pn:#fff;--ink:#17261f;--mut:#62736a;--ln:#d5ddd8;--ac:#0f7a5a;--bad:#c0392b;--ok:#1e8449;--wn:#c77d0a;--soft:#e2f1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--pn:#17211c;--ink:#e5efe9;--mut:#8fa399;--ln:#27352e;--ac:#3ecf9c;--bad:#f1796b;--ok:#52d08a;--wn:#f0b040;--soft:#13302a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--pn:#17211c;--ink:#e5efe9;--mut:#8fa399;--ln:#27352e;--ac:#3ecf9c;--bad:#f1796b;--ok:#52d08a;--wn:#f0b040;--soft:#13302a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Manrope",system-ui,sans-serif}
header{background:var(--pn);border-bottom:1px solid var(--ln);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{font:600 23px "Fraunces",Georgia,serif;margin:0}h2{font-size:13px;margin:0 0 10px}.sub{color:var(--mut);font-size:12px}
main{max-width:1400px;margin:auto;padding:14px}.tabs,.row{display:flex;gap:6px;flex-wrap:wrap}.tabs{margin-bottom:12px}
button{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:960px){.g{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:480px}th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}
.bar{display:grid;grid-template-columns:160px 1fr 62px;gap:8px;align-items:center;margin:7px 0;font-size:12.5px}.bar>div:nth-child(2){background:var(--bg);border-radius:3px;display:flex;height:14px;overflow:hidden}.bar i{display:block;height:100%}
label{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}label output{font-weight:700;color:var(--ac)}input[type=range]{width:100%;accent-color:var(--ac)}
.chat{height:260px;overflow:auto;border:1px solid var(--ln);border-radius:6px;padding:8px;background:var(--bg)}
.m{margin:0 0 8px;padding:7px 10px;border-radius:8px;max-width:94%;white-space:pre-wrap;font-size:13px}.m.a{background:var(--pn);border:1px solid var(--ln)}.m.u{background:var(--ac);color:#fff;margin-left:auto}
.ask{display:flex;gap:6px;margin:8px 0}.ask input{flex:1;padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);color:var(--ink);font:inherit}
svg text{fill:var(--mut);font-size:10px;font-family:inherit}.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.note{background:var(--soft);border-left:3px solid var(--ac);padding:8px 10px;border-radius:0 6px 6px 0;font-size:12.5px;margin-top:10px}td.c{text-align:center}
</style></head><body>
<header><div><h1>Delivery Performance Crisis Analyst</h1><div class="sub">Orders, warehouses, routes, staffing, inventory and delivery data in one view · 12 weeks · assumed data</div></div><button id="th">Toggle theme</button></header>
<main><div class="tabs" id="tabs"></div>
<section id="t0"></section><section id="t1" hidden></section><section id="t2" hidden></section><section id="t3" hidden></section>
<div class="card"><h2>AI operations analyst</h2><div class="chat" id="chat" aria-live="polite"></div>
<div class="ask"><input id="q" placeholder="Ask: why are deliveries late? · is capacity the problem? · what about Delhi? · hire 20 pickers, route 60%" aria-label="Ask the analyst"><button class="p" id="go">Ask</button></div>
<div class="row"><button data-q="Why are deliveries late?">Why are deliveries late?</button><button data-q="Is logistics capacity the problem?">Is capacity the problem?</button><button data-q="Which warehouse is worst?">Worst warehouse</button><button data-q="Tell me about inventory">Inventory</button><button data-q="Recommend a plan">Recommend a plan</button></div></div></main>
<script>
const WH=["Hyderabad","Mumbai","Delhi","Bengaluru"],WK=Array.from({length:12},(_,i)=>"W"+(i+1)),CL=["#0f7a5a","#2563a8","#c0392b","#c77d0a"];
const A={cov:[[98,98,97,98,97,98,97,97,98,97,97,98],[97,96,96,94,92,89,86,82,79,76,74,72],[95,95,94,94,93,92,92,90,90,88,88,87],[96,96,95,95,96,95,95,94,95,94,94,94]],
so:[[3,3,3,4,3,4,3,4,4,3,4,4],[4,4,5,4,5,5,6,5,6,6,7,6],[4,5,6,8,9,11,12,14,15,16,17,18],[4,4,5,5,6,7,8,8,9,10,10,11]],
fail:[[4,4,4,4,4,4,5,4,4,4,5,4],[5,5,5,5,5,6,5,6,6,6,6,6],[5,5,5,6,6,6,6,6,6,7,6,6],[5,5,6,6,7,7,8,9,9,10,10,11]],
imb:[[.12,.13,.12,.12,.13,.12,.14,.13,.12,.13,.12,.13],[.15,.15,.16,.15,.16,.17,.16,.17,.16,.18,.17,.18],[.12,.13,.15,.2,.24,.28,.3,.33,.35,.38,.4,.42],[.15,.15,.16,.16,.17,.17,.18,.18,.19,.2,.2,.21]]};
const BO=[9000,12000,11000,8000],TB=[20,23,21,22];
const mk=(h,w)=>({cov:A.cov[h][w],so:A.so[h][w],fail:A.fail[h][w],imb:A.imb[h][w],util:62+[2,10,8,0][h]+((w*7+h*3)%5)-2,ord:Math.round(BO[h]*(1+.02*w)*(1+((w%3)-1)*.02))});
function calc(m,h){const rem=m.so*1.6,pick=3/(m.cov/100),wait=2+10*m.imb,tr=TB[h]+rem*.28,last=5+m.fail*.5,tot=pick+wait+tr+last,on=100/(1+Math.exp((tot-50)/6.5));return{pick,wait,tr,last,tot,on,comp:m.ord*((1-on/100)*.3+.004),ord:m.ord,rem,util:m.util,cov:m.cov,so:m.so,fail:m.fail,imb:m.imb}}
const KEYS=['pick','wait','tr','last','tot','on','comp','ord','rem','util','cov','so','fail','imb'];
function G(hs,w0,w1,ov){const s={ord:0};KEYS.forEach(k=>s[k]=0);let n=0;hs.forEach(h=>{for(let w=w0;w<=w1;w++){let m=mk(h,w);if(ov)m=ov(m,h);const c=calc(m,h);KEYS.forEach(k=>s[k]+=(k=='comp'||k=='ord')?c[k]:c[k]*c.ord);n++}});const o=s.ord;KEYS.forEach(k=>{s[k]=(k=='comp'||k=='ord')?s[k]/(w1-w0+1):s[k]/o});return s}
const $=id=>document.getElementById(id),f=(n,d=0)=>n.toLocaleString('en-IN',{maximumFractionDigits:d}),ALL=[0,1,2,3],sg=n=>(n>=0?'+':'−')+f(Math.abs(n),1);
const E=G(ALL,0,2),Lt=G(ALL,9,11);let sel=-1;const pick=()=>sel<0?ALL:[sel];
function corr(a,b){const n=a.length,ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n;let s=0,x=0,y=0;for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return s/Math.sqrt(x*y)}
function line(ser,h=210,unit=''){const W=620,Lm=42,Bm=22,all=ser.flatMap(s=>s.v),mn=Math.min(...all),mx=Math.max(...all),p=(mx-mn)*.1||1,lo=mn-p,hi=mx+p,x=i=>Lm+i*(W-Lm-10)/11,y=v=>h-Bm-(v-lo)/(hi-lo)*(h-Bm-10);let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${Lm}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="3" y="${y(v)+3}">${f(v)}${unit}</text>`}return`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">${g}${WK.map((q,i)=>`<text x="${x(i)-6}" y="${h-6}">${q}</text>`).join('')}${ser.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.3" points="${s.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`).join('')}</svg><div class="leg">${ser.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`}
const wkSeries=(h,k)=>Array.from({length:12},(_,w)=>G([h],w,w)[k]);
function ov0(){const lg=ALL.map(h=>({h,e:G([h],0,2),l:G([h],9,11)})),cap=Lt.util;$('t0').innerHTML=`<div class="k"><div class="kp"><b style="color:var(--bad)">${f(Lt.on,1)}%</b><span>On-time delivery, last 3 weeks (was ${f(E.on,1)}%)</span></div><div class="kp"><b>${f(Lt.tot,1)}h</b><span>Average order-to-door time (was ${f(E.tot,1)}h)</span></div><div class="kp"><b style="color:var(--bad)">${f(Lt.comp)}</b><span>Complaints per week (was ${f(E.comp)})</span></div><div class="kp"><b style="color:var(--ok)">${f(cap)}%</b><span>Fleet utilization: capacity is adequate</span></div></div>
<div class="g"><div class="card"><h2>On-time delivery % by warehouse</h2>${line(WH.map((n,h)=>({n,c:CL[h],v:wkSeries(h,'on')})),210,'%')}</div><div class="card"><h2>Complaints per week (all warehouses)</h2>${line([{n:'Complaints',c:'#c0392b',v:Array.from({length:12},(_,w)=>G(ALL,w,w).comp)}])}<div class="note">Complaints grow faster than orders. Orders rose about 22% over 12 weeks, so volume alone doesn’t explain the surge.</div></div></div>
<div class="card"><h2>Warehouse league table (last 3 weeks)</h2><div class="tw"><table><thead><tr><th>Warehouse</th><th>On-time</th><th>Order-to-door h</th><th>Complaints/wk</th><th>Picker coverage</th><th>Stock-outs</th><th>Shipped from far warehouse</th><th>Failed attempts</th></tr></thead><tbody>${lg.map(r=>`<tr><td>${WH[r.h]}</td><td style="color:${r.l.on<70?'var(--bad)':r.l.on<85?'var(--wn)':'var(--ok)'};font-weight:700">${f(r.l.on,1)}%</td><td>${f(r.l.tot,1)}</td><td>${f(r.l.comp)}</td><td>${f(r.l.cov)}%</td><td>${f(r.l.so,1)}%</td><td>${f(r.l.rem,1)}%</td><td>${f(r.l.fail,1)}%</td></tr>`).join('')}</tbody></table></div></div>`}
const ST=[['pick','Picking and packing (staffing)','#2563a8'],['wait','Waiting for dispatch (route balance)','#8a4fb5'],['tr','Transit (stock in wrong warehouse)','#c0392b'],['last','Last mile (failed attempts)','#c77d0a']];
function dg(){const g=pick(),e=G(g,0,2),l=G(g,9,11),dT=l.tot-e.tot,mx=Math.max(e.tot,l.tot),pool=[];ALL.forEach(h=>{for(let w=0;w<12;w++){const c=calc(mk(h,w),h);pool.push(c)}});const cs=[['Picker coverage','cov'],['Stock-out rate','so'],['Route imbalance','imb'],['Failed attempts','fail'],['Fleet utilization','util'],['Order volume','ord']].map(a=>[a[0],corr(pool.map(p=>p[a[1]]),pool.map(p=>p.tot))]);
$('t1').innerHTML=`<div class="row" style="margin-bottom:10px">${['All warehouses',...WH].map((n,i)=>`<button data-w="${i-1}" class="${i-1==sel?'on':''}">${n}</button>`).join('')}</div><div class="g"><div class="card"><h2>Where the extra delivery time comes from</h2>${[['Weeks 1–3',e],['Weeks 10–12',l]].map(a=>`<div class="bar" style="grid-template-columns:90px 1fr 62px"><div>${a[0]}</div><div>${ST.map(s=>`<i title="${s[1]}" style="width:${a[1][s[0]]/mx*100}%;background:${s[2]}"></i>`).join('')}</div><b style="text-align:right">${f(a[1].tot,1)}h</b></div>`).join('')}<div class="leg">${ST.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join('')}</div><h2 style="margin-top:14px">Share of the ${f(dT,1)}-hour increase</h2>${ST.map(s=>{const d=l[s[0]]-e[s[0]];return`<div class="bar"><div>${s[1].split(' (')[0]}</div><div><i style="width:${Math.max(0,d)/Math.max(.01,dT)*100}%;background:${s[2]}"></i></div><b style="text-align:right">${f(d/Math.max(.01,dT)*100)}%</b></div>`}).join('')}</div>
<div class="card"><h2>What moves with delivery time (48 warehouse-weeks)</h2>${cs.map(c=>`<div class="bar"><div>${c[0]}</div><div style="justify-content:${c[1]<0?'flex-end':'flex-start'}"><i style="width:${Math.abs(c[1])*100}%;background:${Math.abs(c[1])<.3?'var(--mut)':c[1]>0?'var(--bad)':'var(--ok)'}"></i></div><b style="text-align:right">${c[1].toFixed(2)}</b></div>`).join('')}<div class="note"><b>The capacity paradox.</b> Fleet utilization sits near ${f(Lt.util)}% with almost no link to delay. The problem isn’t how many vehicles or pickers exist in total. It’s that stock, people and routes are in the wrong place at the wrong time.</div></div></div>`;
$('t1').querySelector('.row').onclick=e=>{const w=e.target.dataset.w;if(w!==undefined){sel=+w;dg()}}}
const RT=[['HYD-1','Hyderabad',68,38,3.1],['HYD-2','Hyderabad',64,36,2.8],['MUM-1','Mumbai',74,41,4.4],['MUM-2','Mumbai',71,40,4.9],['DEL-1','Delhi',97,58,9.8],['DEL-2','Delhi',94,55,8.7],['DEL-3','Delhi',91,52,7.9],['DEL-4','Delhi',44,22,2.2],['DEL-5','Delhi',41,20,2.0],['BLR-1','Bengaluru',66,37,4.8],['BLR-2','Bengaluru',63,35,5.2],['BLR-3','Bengaluru',62,34,5.5]];
const CAT=['Mobiles','Fashion','Home','Grocery','Electronics'],COV=[[14,12,3,9],[11,9,4,7],[10,25,22,12],[6,7,2,5],[13,10,4,24]];
function wr(){const tf=[];CAT.forEach((c,i)=>{const mx=Math.max(...COV[i]),mn=Math.min(...COV[i]);if(mx>=20&&mn<=7)tf.push(`Move ${c} stock from ${WH[COV[i].indexOf(mx)]} (${mx} days of cover) to ${WH[COV[i].indexOf(mn)]} (${mn} days).`)});
$('t2').innerHTML=`<div class="g"><div class="card"><h2>Route load: some routes overloaded, others half empty</h2><div class="tw"><table><thead><tr><th>Route</th><th>Warehouse</th><th>Vehicle load</th><th>Stops</th><th>Avg delay h</th></tr></thead><tbody>${RT.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td style="color:${r[2]>88?'var(--bad)':r[2]<50?'var(--wn)':'var(--ink)'};font-weight:600">${r[2]}%</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div><div class="note">Delhi runs three routes above 90% load while two sit below 45%. Total capacity is fine; the allocation of stops is not.</div></div>
<div class="card"><h2>Inventory days of cover by warehouse</h2><div class="tw"><table><thead><tr><th>Category</th>${WH.map(w=>`<th>${w}</th>`).join('')}</tr></thead><tbody>${CAT.map((c,i)=>`<tr><td>${c}</td>${COV[i].map(v=>`<td class="c" style="background:${v<=7?'rgba(192,57,43,.35)':v>=20?'rgba(199,125,10,.35)':'transparent'}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sub">Red: under 7 days (stock-out risk). Amber: over 20 days (overstock).</p><div class="note"><b>Suggested transfers</b><br>${tf.join('<br>')||'No imbalance found.'}</div></div></div>`}
const REC={pk:26,rb:70,rt:70,ad:60};let S={pk:0,rb:0,rt:0,ad:0};
const SL=[['pk','Evening-shift pickers hired (Mumbai, Delhi)',0,40,1],['rb','Inventory rebalancing across warehouses %',0,100,5],['rt','Route re-optimization %',0,100,5],['ad','Address validation and slot booking %',0,100,5]];
function ovf(){return(m,h)=>{const o={...m};if(h==1)o.cov=Math.min(98,m.cov+S.pk*.9);if(h==2)o.cov=Math.min(98,m.cov+S.pk*.4);o.so=m.so*(1-.6*S.rb/100);if(m.imb>.12)o.imb=m.imb-(m.imb-.12)*.8*S.rt/100;if(m.fail>4)o.fail=m.fail-(m.fail-4)*.7*S.ad/100;return o}}
function sim(){$('t3').innerHTML=`<div class="g"><div class="card"><h2>Improvement simulator (projected on the last 3 weeks)</h2>${SL.map(s=>`<label for="s_${s[0]}">${s[1]}<output id="o_${s[0]}"></output></label><input type="range" id="s_${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${S[s[0]]}">`).join('')}<div class="row" style="margin-top:12px"><button class="p" id="rp">Apply recommended plan</button><button id="rz">Reset</button></div></div><div class="card" id="sr"></div></div>`;SL.forEach(s=>$('s_'+s[0]).oninput=e=>{S[s[0]]=+e.target.value;res()});$('rp').onclick=()=>{S={...REC};syn();res()};$('rz').onclick=()=>{S={pk:0,rb:0,rt:0,ad:0};syn();res()};res()}
function syn(){SL.forEach(s=>{$('s_'+s[0]).value=S[s[0]]})}
function pj(){const n=G(ALL,9,11,ovf()),cost=.28*S.pk+.05*S.rb+.03*S.rt+.02*S.ad,sav=(Lt.comp-n.comp)*450*4.3/1e5;return{n,cost,sav,net:sav-cost}}
function res(){SL.forEach(s=>$('o_'+s[0]).textContent=S[s[0]]+(s[0]=='pk'?'':'%'));const p=pj(),n=p.n;$('sr').innerHTML=`<h2>Projected outcome</h2><div class="k"><div class="kp"><b style="color:var(--ok)">${f(n.on,1)}%</b><span>On-time (now ${f(Lt.on,1)}%)</span></div><div class="kp"><b>${f(n.tot,1)}h</b><span>Order-to-door (now ${f(Lt.tot,1)}h)</span></div><div class="kp"><b>${f(n.comp)}</b><span>Complaints/wk (now ${f(Lt.comp)})</span></div></div><div class="k"><div class="kp"><b>₹${f(p.cost,1)}L</b><span>Monthly cost</span></div><div class="kp"><b>₹${f(p.sav,1)}L</b><span>Monthly complaint savings</span></div><div class="kp"><b style="color:${p.net>=0?'var(--ok)':'var(--bad)'}">${p.net>=0?'+':'−'}₹${f(Math.abs(p.net),1)}L</b><span>Net per month</span></div></div><p class="sub">Assumes ₹450 handling and refund cost per complaint, ₹28,000 monthly cost per picker, and the lever effects stated in the model. These are assumptions to replace with real figures.</p>`}
const say=(t,u)=>{const e=document.createElement('div');e.className='m '+(u?'u':'a');e.textContent=t;$('chat').appendChild(e);$('chat').scrollTop=1e9};
function tab(i){[0,1,2,3].forEach(k=>{$('t'+k).hidden=k!=i;$('tb'+k).className=k==i?'on':''})}
function ask(t){t=t.trim();if(!t)return;say(t,1);const l=t.toLowerCase(),nm=re=>{const m=l.match(re);return m?+m[1]:null};let ch=[];const set=(k,v,mx)=>{if(v!==null){S[k]=Math.min(mx,v);ch.push(k)}};
set('pk',nm(/(?:hire|picker|staff)[^\d]{0,12}(\d+)/),40);set('rb',nm(/(?:rebalanc|inventory|stock)[^\d]{0,12}(\d+)/),100);set('rt',nm(/route[^\d]{0,12}(\d+)/),100);set('ad',nm(/(?:address|slot)[^\d]{0,12}(\d+)/),100);
if(ch.length){tab(3);sim();const p=pj();return say(`Applied your levers. Projected on-time ${f(p.n.on,1)}% (now ${f(Lt.on,1)}%), complaints ${f(p.n.comp)}/wk (now ${f(Lt.comp)}), net ₹${f(p.net,1)}L per month.`)}
const dT=Lt.tot-E.tot,sh=k=>f((Lt[k]-E[k])/dT*100);
if(/capacity|fleet|vehicle/.test(l)){tab(1);dg();return say(`No. Fleet utilization is about ${f(Lt.util)}% and hasn’t trended with delay. Delivery time rose ${f(dT,1)}h while capacity stayed adequate.\nThe real causes are allocation problems: stock in the wrong warehouse, understaffed evening shifts, unbalanced routes and failed deliveries.`)}
if(/why|cause|late|delay|reason/.test(l)){tab(1);dg();return say(`On-time delivery fell from ${f(E.on,1)}% to ${f(Lt.on,1)}% and the average order-to-door time grew ${f(dT,1)}h.\nShare of that increase: transit (orders shipped from distant warehouses because local stock ran out) ${sh('tr')}%, last mile (failed attempts, mostly Bengaluru) ${sh('last')}%, picking (Mumbai and Delhi staffing gaps) ${sh('pick')}%, dispatch waiting (unbalanced Delhi routes) ${sh('wait')}%.\nCapacity isn’t the cause; coordination between inventory, staffing and routing is.`)}
